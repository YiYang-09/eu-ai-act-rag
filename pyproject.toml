[project]
name = "lexrag"
version = "0.1.0"
description = "Retrieval-augmented QA over the EU AI Act and GDPR, with article-level citations and evaluation"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "requests>=2.31",
  "rank-bm25>=0.2.2",
  "networkx>=3.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
dense = ["numpy>=1.26", "sentence-transformers>=3.0"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "qdrant-client>=1.10", "httpx>=0.27"]
ui = ["streamlit>=1.35", "requests>=2.31"]
tracing = ["langfuse>=2.40,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
