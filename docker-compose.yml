# docker compose up -d                          Qdrant + ingest + API + UI, LLM from Ollama on the host
# docker compose --profile ollama up -d         also run Ollama in a container (set OLLAMA_URL=http://ollama:11434)
# docker compose --profile tracing up -d        also run Langfuse v2 (UI on :3000; put its keys in .env)
# GPU for the containerised Ollama: add -f docker-compose.gpu.yml

x-app: &app
  build: .
  image: lexrag:latest
  env_file:
    - path: .env
      required: false
  volumes:
    - models:/models          # Hugging Face cache (bge-m3, bge-reranker-v2-m3), downloaded once
    - ./data/index:/app/data/index   # embedding + rerank caches survive rebuilds
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  ingest:                     # one-shot: incremental, so re-running only embeds changed chunks
    <<: *app
    command: ["python", "scripts/ingest.py", "--qdrant-url", "http://qdrant:6333"]
    depends_on: [qdrant]
    restart: "no"

  api:
    <<: *app
    environment:
      LEXRAG_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    depends_on:
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 180s

  ui:
    <<: *app
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.5.7
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

  langfuse-db:
    profiles: [tracing]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes: [langfuse-db:/var/lib/postgresql/data]

  langfuse:
    profiles: [tracing]
    image: langfuse/langfuse:2
    depends_on: [langfuse-db]
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me}
      SALT: ${LANGFUSE_SALT:-change-me}
      TELEMETRY_ENABLED: "false"

volumes:
  qdrant:
  models:
  ollama:
  langfuse-db:
